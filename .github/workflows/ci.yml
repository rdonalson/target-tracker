name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-debug
          - os: ubuntu-latest
            preset: linux-gcc-debug
          - os: ubuntu-latest
            preset: linux-clang-asan
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.preset }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format
        run: |
          find include src app tests -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: Configure
        run: cmake --preset linux-gcc-debug -DTRACKER_BUILD_TESTS=OFF
      - name: Run clang-tidy
        run: clang-tidy -p build/linux-gcc-debug src/*.cpp app/*.cpp --warnings-as-errors='*'
